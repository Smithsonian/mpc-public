[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wis"
version = "2.0.0"
description = "Where is satellite - Observatory position calculations using SPICE kernels"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "MPC Team", email = "mpc@cfa.harvard.edu" },
    { name = "Matt Payne", email = "mpayne@cfa.harvard.edu" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.2.0",
    "bs4>=0.0.2",
    "cachetools>=7.1.4",
    "jplephem>=2.24",
    "numpy<2",
    "pydantic>=2",
    "requests>=2.34.2",
    "spiceypy>=8.1.0",
]

[tool.setuptools.package-dir]
wis = "wis"

[project.urls]
"Homepage" = "https://github.com/Smithsonian/mpc-software/"
"Bug Tracker" = "https://github.com/Smithsonian/mpc-software/issues"

[project.scripts]
download-wis-kernels = "wis.download_kernels:main"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that require network access (deselect with '-m \"not integration\"')"
]

[tool.ruff.lint]
extend-select = ["W", "I", "B", "D", "UP", "SIM", "RUF", "ANN"]
exclude = [
    "docs/*",
]
pydocstyle.convention = "google"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
